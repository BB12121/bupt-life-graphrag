[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bupt-life-graphrag"
version = "0.1.0"
description = "Evidence-grounded GraphRAG backend for the BUPT survival guide"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=1.26,<3", "networkx>=3.3,<4", "httpx>=0.27,<1", "requests>=2.32,<3",
  "jieba>=0.42.1,<0.43", "sentence-transformers>=3.3,<6", "filelock>=3.16,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "psutil>=6,<8"]

[project.scripts]
bupt-rag = "bupt_rag.cli:main"

[tool.setuptools.packages.find]
include = ["bupt_rag*"]

[tool.setuptools.package-data]
bupt_rag = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
